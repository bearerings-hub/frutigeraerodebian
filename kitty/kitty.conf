# ╭─────────────────────────────────────────────────────────╮
# │         aero-nature · kitty terminal config             │
# │         frosted glass · deep greens · sky blues         │
# ╰─────────────────────────────────────────────────────────╯

# ── Font ──────────────────────────────────────────────────
font_family              JetBrains Mono
bold_font                JetBrains Mono Bold
italic_font              JetBrains Mono Italic
bold_italic_font         JetBrains Mono Bold Italic
font_size                12.0

# ── Window ────────────────────────────────────────────────
background_opacity       0.82
blur_radius              12
window_padding_width     14
hide_window_decorations  no
remember_window_size     yes

# ── Cursor ────────────────────────────────────────────────
cursor                   #a8e6c0
cursor_text_color        #0d1f14
cursor_shape             beam
cursor_blink_interval    0.5

# ── Colors ────────────────────────────────────────────────
background               #0e1f18
foreground               #d4f0e2
selection_background     #2e7d5a
selection_foreground     #eaf9f1

# Black
color0                   #0d1a12
color8                   #1e3a28
# Red → amber leaf
color1                   #d96b3a
color9                   #f08c55
# Green → new growth
color2                   #5ec47a
color10                  #8ee8a8
# Yellow → sunlit canopy
color3                   #c8d94a
color11                  #dff270
# Blue → sky/water
color4                   #3a9bd5
color12                  #6dc4f5
# Magenta → blossom
color5                   #8e6fc7
color13                  #b89fe8
# Cyan → glacier mist
color6                   #3ecfcf
color14                  #7aeaea
# White
color7                   #c8e8d8
color15                  #eaf9f2

# ── Tab Bar ───────────────────────────────────────────────
tab_bar_style            powerline
tab_powerline_style      slanted
tab_bar_background       #0b1a10
active_tab_background    #2e7d5a
active_tab_foreground    #eaf9f1
inactive_tab_background  #152a1c
inactive_tab_foreground  #7ab89a
inactive_tab_font_style  normal
active_tab_font_style    bold

# ── Misc ──────────────────────────────────────────────────
scrollback_lines         5000
enable_audio_bell        no
visual_bell_duration     0.1
url_color                #6dc4f5
url_style                curly
